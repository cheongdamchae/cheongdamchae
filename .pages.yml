media:
  - name: news_media
    label: 소식 사진
    input: content/media
    output: /images/news
    categories: [image]

content:
  - name: news
    label: 소식 (News)
    type: collection
    path: content/news
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [date, ko.title, draft]
      primary: ko.title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: 날짜
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: slug
        label: 주소에 쓸 영문 이름
        type: string
        required: true
        description: 영문 소문자와 하이픈만. 예 = duroc-samgyeopsal → cheongdamchaesg.com/news/duroc-samgyeopsal/ (한 번 정하면 바꾸지 마세요)
      - name: draft
        label: 임시 저장 (체크하면 사이트에 안 보임)
        type: boolean
        default: false
      - name: cover
        label: 대표 사진
        type: image
        description: 목록과 카톡 공유 미리보기에 쓰입니다. 가로가 긴 4:3 사진이 가장 잘 맞습니다.
        options:
          media: news_media
      - name: cover_alt
        label: 사진 설명 (검색엔진용)
        type: string
        description: 사진에 무엇이 보이는지 한 줄. 예 = 무쇠 철판에서 익어가는 듀록 삼겹살
      - name: video
        label: 영상 링크
        type: string
        pattern:
          regex: '^$|^https?://'
          message: https:// 로 시작하는 주소를 넣어주세요
        description: 유튜브나 인스타그램 주소를 붙여넣으면 글 안에 영상이 들어갑니다. 영상 파일은 올리지 마세요.
      - name: ko
        label: 한국어
        type: object
        fields:
          - name: title
            label: 제목
            type: string
            required: true
          - name: summary
            label: 한 줄 요약
            type: string
            description: 목록과 검색 결과에 보이는 문장. 두 문장 이내로.
          - name: body
            label: 본문
            type: rich-text
            required: true
      - name: en
        label: English (나중에 채워도 됩니다)
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: summary
            label: Summary
            type: string
          - name: body
            label: Body
            type: rich-text

  - name: settings
    label: 사이트 기본값
    type: file
    path: content/settings.yml
    fields:
      - name: notice
        label: 상단 공지 문구 (비워두면 안 보임)
        type: string
